<style>
*{box-sizing:border-box}
:root{--bg:#0e0f11;--panel:#191b1f;--panel2:#1f2226;--line:#2a2d33;--text:#c6c9cf;--dim:#868b94;--white:#f2f4f7;--red:#e63946;--amber:#fca311}:root{--bg:#0e0f11;--panel:#191b1f;--panel2:#1f2226;--line:#2a2d33;--text:#c6c9cf;--dim:#868b94;--white:#f2f4f7;--red:#e63946;--琥珀:#fca311}
html{scroll-behavior:smooth}
body{margin:0;color:var(--text);font:15px/1.78 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(900px 500px at 85% -10%,rgba(230,57,70,.09),transparent 60%),radial-gradient(700px 400px at 0% 100%,rgba(252,163,17,.05),transparent 60%),var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:rgba(230,57,70,.35);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2b2f35;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.layout{display:flex;min-height:100vh}
.sidebar{width:262px;flex:0 0 262px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:80;background:linear-gradient(180deg,#101215,#0c0d0f);border-right:1px solid var(--line);padding:24px 0 40px}
.content{flex:1;min-width:0;max-width:880px;margin:0 auto;padding:40px 40px 120px}

.brand{display:block;padding:0 22px 18px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand b{display:block;color:var(--white);font-size:15px;letter-spacing:.5px}

.searchwrap{padding:0 16px 14px}

#q::placeholder{color:#5c6068}
#results{border-top:1px solid var(--line);max-height:44vh;overflow-y:auto;padding:6px 0}
#results a{display:flex;gap:9px;padding:7px 22px;font-size:12.5px;color:#a7adb6}

.nav a:hover{background:#17191d;color:var(--white);border-left-color:#3d424a}

.side-foot{padding:24px 22px 0;margin-top:20px;border-top:1px solid var(--line);font-size:11px;color:#4e525a;line-height:1.9}

.hero{padding:30px 0 4px;border-bottom:1px solid var(--line)}
.hero em{display:block;font-style:normal;font-size:11.5px;letter-spacing:4px;color:var(--red);font-weight:700;margin-bottom:16px}
.hero h1{margin:0 0 16px;font-size:31px;line-height:1.32;color:var(--white);font-weight:800;letter-spacing:-.3px}
.hero p{margin:0 0 20px;color:#9ba1aa;font-size:14px;max-width:620px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:24px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px;margin-top:30px}
.pcard{display:block;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:19px;transition:.2s}
.pcard:hover{border-color:rgba(230,57,70,.55);background:var(--panel2);transform:translateY(-3px)}
.pcard .pnum{font-size:10.5px;font-weight:800;color:var(--red);letter-spacing:2px}

.pcard .pmeta{display:block;font-size:11px;color:#5f646c;border-top:1px solid var(--line);padding-top:10px}

.idx-h{margin:38px 0 0;font-size:14px;color:var(--white);letter-spacing:1px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.idx{display:grid;gap:12px;margin-top:16px}
.idx-g{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 16px}
.idx-g b{display:block;color:var(--white);font-size:13px;margin-bottom:9px}
.idx-g a{display:inline-block;font-size:12.5px;color:#9aa0a9;border:1px solid var(--line);border-radius:5px;padding:3px 9px;margin:0 6px 6px 0}

.lede{margin:0 0 20px;padding-bottom:20px;border-bottom:1px solid var(--line);color:#8f959e;font-size:13px;letter-spacing:.3px}

.list{margin:0;padding:0;list-style:none}

.list li:last-child{border-bottom:0}

.list li strong{color:var(--white);font-weight:700}
